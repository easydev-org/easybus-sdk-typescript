name: ci

on:
  push:
    branches: [main]
    # Tags too: the publish job below runs only for them, and a tag push that did not start
    # this workflow would never publish anything.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The generated wire code must match the committed proto.
  #
  # This is the guard that makes the codegen bot's pull requests worth opening: without it,
  # someone can hand-edit protocol.proto, forget to regenerate, and every consumer of this
  # package silently loses the new fields — a field this build does not know about is dropped
  # on the wire, with no error anywhere.
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - name: Regenerate into a temp copy and diff
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:$PATH"
          TMP="$(mktemp -d)"
          cp -a . "$TMP/repo"
          # MUST run inside proto/ with the relative template: `buf generate
          # --template proto/buf.gen.yaml --path proto` from the repo root targets
          # `proto/proto`, finds no files, and — this is the trap — still exits 0. The
          # original check therefore passed while generating nothing at all, which is how a
          # stale src/gen could look up to date.
          (cd "$TMP/repo/proto" && buf generate --template buf.gen.yaml)
          if ! diff -r "$TMP/repo/src/gen" src/gen; then
            echo "::error::src/gen is out of date with proto/easybus/v1/protocol.proto"
            echo "Run 'npm run gen' and commit the result."
            exit 1
          fi
          echo "generated code is up to date"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # No registry/token needed: the SDK has no private dependencies.
      # `npm ci` against the committed lockfile: reproducible, and it fails loudly
      # when package.json and the lock have drifted. A plain install with no
      # lockfile also crashes on some npm versions
      # ("Cannot read properties of null (reading 'edgesOut')").
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      # The shared config cases require a broker and FAIL without one, rather than
      # skipping: a silent skip reports success while never touching the KV path.
      - name: start nats
        run: |
          curl -fsSL -o /tmp/nats.tgz \
            https://github.com/nats-io/nats-server/releases/download/v2.15.1/nats-server-v2.15.1-linux-amd64.tar.gz
          tar -xzf /tmp/nats.tgz -C /tmp
          /tmp/nats-server-v2.15.1-linux-amd64/nats-server -js -p 4222 &
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/4222) 2>/dev/null; then echo "nats up"; exit 0; fi
            sleep 1
          done
          echo "nats did not start"; exit 1
      - run: npm test
        env:
          EASYBUS_NATS_URL: nats://127.0.0.1:4222
      # There is no `npm run build` script — this package's build is
      # `tsconfig.build.json`, invoked directly (see the publish flow). Calling a
      # missing script fails the step, so it is spelled out here instead.
      - run: npx tsc -p tsconfig.build.json

  # A real broker, in the SAME image the other three SDKs use.
  #
  # The matrix above runs the suite against NO broker: the config cases skip
  # themselves when EASYBUS_NATS_URL is unset, so a TypeScript-only run never
  # exercises the KV path at all. That path is the only way a restarted extension
  # learns its configuration, and it is where every config defect in this SDK was
  # found.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `--exit-code-from` makes the container's exit code the step's exit code, so a
      # failing assertion fails the job without extra plumbing.
      - name: conformance in a pinned environment
        run: |
          docker compose up --build --abort-on-container-exit \
            --exit-code-from conformance

      - name: logs
        if: failure()
        run: docker compose logs --no-color

      - name: down
        if: always()
        run: docker compose down -v

  # Publish the package to GitHub Packages on a version tag.
  #
  # Consumers install it from here (a `file:` tarball vendored into an extension was a second
  # copy that had to be refreshed by hand, and was forgotten twice — the extension then compiled
  # against a contract the deployment no longer spoke).
  #
  # Runs only on `v*` tags, and only after test + conformance: a package that cannot pass its own
  # suite must not become what everyone else depends on.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, conformance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@easydev-org'
      - run: npm ci
      - run: npx tsc -p tsconfig.build.json

      # The tag is the version consumers ask for, so an accidental mismatch between tag and
      # package.json would publish something nobody can reference. Fail instead.
      - name: Version must match the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "publishing $pkg"

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
