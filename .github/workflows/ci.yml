name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # No registry/token needed: the SDK has no private dependencies.
      # `npm ci` against the committed lockfile: reproducible, and it fails loudly
      # when package.json and the lock have drifted. A plain install with no
      # lockfile also crashes on some npm versions
      # ("Cannot read properties of null (reading 'edgesOut')").
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      # The shared config cases require a broker and FAIL without one, rather than
      # skipping: a silent skip reports success while never touching the KV path.
      - name: start nats
        run: |
          curl -fsSL -o /tmp/nats.tgz \
            https://github.com/nats-io/nats-server/releases/download/v2.15.1/nats-server-v2.15.1-linux-amd64.tar.gz
          tar -xzf /tmp/nats.tgz -C /tmp
          /tmp/nats-server-v2.15.1-linux-amd64/nats-server -js -p 4222 &
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/4222) 2>/dev/null; then echo "nats up"; exit 0; fi
            sleep 1
          done
          echo "nats did not start"; exit 1
      - run: npm test
        env:
          EASYBUS_NATS_URL: nats://127.0.0.1:4222
      # There is no `npm run build` script — this package's build is
      # `tsconfig.build.json`, invoked directly (see the publish flow). Calling a
      # missing script fails the step, so it is spelled out here instead.
      - run: npx tsc -p tsconfig.build.json

  # A real broker, in the SAME image the other three SDKs use.
  #
  # The matrix above runs the suite against NO broker: the config cases skip
  # themselves when EASYBUS_NATS_URL is unset, so a TypeScript-only run never
  # exercises the KV path at all. That path is the only way a restarted extension
  # learns its configuration, and it is where every config defect in this SDK was
  # found.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `--exit-code-from` makes the container's exit code the step's exit code, so a
      # failing assertion fails the job without extra plumbing.
      - name: conformance in a pinned environment
        run: |
          docker compose up --build --abort-on-container-exit \
            --exit-code-from conformance

      - name: logs
        if: failure()
        run: docker compose logs --no-color

      - name: down
        if: always()
        run: docker compose down -v
