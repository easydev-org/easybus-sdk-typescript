name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # NO `cache: npm`: this repository deliberately does not commit a
          # lockfile (it is a library — consumers ignore a dependency's lock, and
          # committing one only adds churn). `cache: npm` requires that file and
          # fails the step when it is absent, which failed all three matrix legs.
      # No registry/token needed: the SDK has no private dependencies.
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build || true
