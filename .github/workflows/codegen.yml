name: codegen

# Regenerates `src/gen` when the contract changes, and opens a pull request with the result.
#
# WHY A BOT. `src/gen` is committed, so nothing at build time forces it to match
# `proto/easybus/v1/protocol.proto`. Editing the proto and forgetting `npm run gen` ships code
# that compiles, passes every test, and silently drops fields: a field this build does not
# know is never serialised, so a capability can look present in a manifest and never reach the
# other side. Nothing fails — the feature just does not work.
#
# WHY A PULL REQUEST rather than pushing to main: the generated diff is mechanical, but a
# CONTRACT change is exactly what a human should look at.

on:
  push:
    branches: [main]
    paths:
      - 'proto/easybus/v1/protocol.proto'
      - 'proto/buf.gen.yaml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codegen-${{ github.sha }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # npm ci, not a global install of the plugin: the generator version comes from the
      # lockfile, so the bot produces byte-identical output to a developer running
      # `npm run gen`. Letting the plugin float would create large diffs unrelated to the
      # contract, and a reviewer could not tell those from a real change.
      - run: npm ci

      - name: Regenerate
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:$PATH"
          npm run gen

      - name: Show what changed
        run: |
          if git diff --quiet -- src/gen; then
            echo "generated code already matches the proto"
          else
            git --no-pager diff --stat -- src/gen
          fi

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: codegen/protocol
          delete-branch: true
          commit-message: |
            codegen: regenerate src/gen from protocol.proto

            Produced by .github/workflows/codegen.yml — no hand edits.
          title: 'codegen: regenerate from protocol.proto'
          body: |
            `protocol.proto` (or `buf.gen.yaml`) changed; this PR carries the regenerated code.

            ### What to review
            The **proto diff in the commit that triggered this run** — that is the real change.
            The generated file is a consequence; if it looks wrong, the contract is wrong.

            ### Why a stale `src/gen` is dangerous
            It compiles and passes every test. A field the generated code does not know about is
            simply absent on the wire, so a capability can look present in a manifest and never
            reach the other side. Nothing fails; the feature just does not work.
          labels: |
            codegen
            automated
